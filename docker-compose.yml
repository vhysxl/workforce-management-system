services:
  gateway:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - employee-master-service
      - attendance-service

  ui:
    build: ./ui
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      API_GATEWAY_URL: http://gateway:8000
    depends_on:
      - gateway

  db:
    image: mysql:latest
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  employee-master-service:
    build: ./backend
    restart: on-failure
    command: ["node", "dist/apps/employee-master-service/main.js"]
    environment:
      DB_HOST: db
      AUTH_SERVICE_URL: http://auth-service:3001/api
    depends_on:
      - db

  auth-service:
    build: ./backend
    restart: on-failure
    command: ["node", "dist/apps/auth-service/main.js"]
    environment:
      DB_HOST: db
      EMPLOYEE_SERVICE_URL: http://employee-master-service:3002/api
    depends_on:
      - db
      - employee-master-service

  attendance-service:
    build: ./backend
    restart: on-failure
    command: ["node", "dist/apps/attendance-service/main.js"]
    environment:
      DB_HOST: db
      TZ: Asia/Jakarta
    volumes:
      - attendance_uploads:/app/uploads/attendance
    depends_on:
      - db

volumes:
  mysql_data:
  attendance_uploads:
