events {}

http {
    client_max_body_size 15M;

    resolver 127.0.0.11 ipv6=off valid=10s;

    server {
        listen 8000;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        set $auth_service http://auth-service:3001;
        set $employee_service http://employee-master-service:3002;
        set $attendance_service http://attendance-service:3003;

        location = /health {
            default_type application/json;
            return 200 '{"status":"ok","service":"wms-nginx-gateway"}';
        }

        location ~* ^/api/[^/]+/internal(/|$) {
            default_type application/json;
            return 403 '{"statusCode":403,"message":"Access to internal endpoints is forbidden"}';
        }

        location /api/auth {
            proxy_pass $auth_service;
        }

        location /api/employees {
            proxy_pass $employee_service;
        }

        location /api/attendance {
            proxy_pass $attendance_service;
            proxy_request_buffering off;
        }

        location = /api {
            proxy_pass $auth_service;
        }

        location = /api/ {
            proxy_pass $auth_service;
        }

        location / {
            return 404;
        }
    }
}
